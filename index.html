<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D3-Celestial | Gökyüzü Haritası</title>
  <link rel="stylesheet" href="celestial.css">
  <style>
    /* Ücretli indirme (paywall) arayüzü */
    #paywall-overlay {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(4, 8, 22, 0.78);
      z-index: 9000;
      align-items: center; justify-content: center;
    }
    #paywall-box {
      background: #0d1530;
      color: #e8ecf8;
      border: 1px solid #2c3a6b;
      border-radius: 10px;
      padding: 24px 28px;
      width: 340px;
      max-width: 92vw;
      box-shadow: 0 12px 48px rgba(0,0,0,.6);
      font-family: Georgia, "Times New Roman", serif;
    }
    #paywall-box h3 { margin: 0 0 8px; font-size: 18px; color: #ffd97a; }
    #paywall-box p  { margin: 0 0 14px; font-size: 13px; line-height: 1.45; color: #b9c2dd; }
    #paywall-box .pw-row { display: flex; gap: 8px; margin-bottom: 10px; }
    #paywall-box input[type=text] {
      flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid #2c3a6b;
      background: #071026; color: #e8ecf8; font: inherit; font-size: 13px;
    }
    #paywall-box button {
      padding: 8px 14px; border: 0; border-radius: 6px; cursor: pointer;
      font: inherit; font-size: 13px;
    }
    #pw-pay   { background: #ffd97a; color: #1a1a1a; font-weight: bold; width: 100%; }
    #pw-pay:disabled { opacity: .5; cursor: default; }
    #pw-download { background: #4caf7d; color: #fff; font-weight: bold; width: 100%; display: none; }
    #pw-cancel { background: transparent; color: #8f9ac0; text-decoration: underline; width: 100%; margin-top: 6px; }
    #pw-status { min-height: 18px; font-size: 12px; margin: 6px 0; color: #9fd0ff; }
    #pw-status.err { color: #ff9a9a; }
    .pw-price { color: #ffd97a; font-weight: bold; }
    #pw-code-row { display: none; }
  </style>
</head>
<body>
  <div id="celestial-map"></div>

  <div id="celestial-form"></div>

  <!-- Ücretli indirme penceresi -->
  <div id="paywall-overlay">
    <div id="paywall-box">
      <h3>Harita Çıktısını İndir</h3>
      <p>Seçtiğiniz tarih ve açılar için oluşturulan yüksek çözünürlüklü gökyüzü haritası çıktısı ücrete tabidir.</p>
      <div id="pw-status"></div>
      <div class="pw-row" id="pw-pay-row">
        <button id="pw-pay">Öde – <span class="pw-price">₺10,00</span></button>
      </div>
      <div class="pw-row" id="pw-code-row">
        <input type="text" id="pw-code" placeholder="Ödeme sonrası verilen kod" autocomplete="off" maxlength="20">
      </div>
      <div class="pw-row"><button id="pw-download">İndir</button></div>
      <button id="pw-cancel">Vazgeç</button>
    </div>
  </div>

  <script src="lib/d3.min.js"></script>
  <script src="lib/d3.geo.projection.min.js"></script>
  <script src="celestial.js"></script>

  <script>
    var config = {
      container: "celestial-map",
      form: true,
      // Parlak, gerçekçi yıldızlar (glow efekti) - src/config.js içinde varsayılan açık
      // Sadece gerekli veri dosyalarını yükle: büyük katalogları (stars.8/14) atla -> hızlı açılış, donma yok
      stars:  { data: "stars.6.json" },
      dsos:   { data: "dsos.bright.json" },
      constellations: { namesType: "ltn" },
    };

    Celestial.display(config);

    // ---------- Ücretli indirme (demo ödeme akışı) ----------
    (function () {
      var PRICE_CENTS = 1000; // 10,00 TL (kuruş cinsinden)
      var overlay  = document.getElementById("paywall-overlay"),
          statusEl = document.getElementById("pw-status"),
          payBtn   = document.getElementById("pw-pay"),
          codeRow  = document.getElementById("pw-code-row"),
          codeIn   = document.getElementById("pw-code"),
          dlBtn    = document.getElementById("pw-download"),
          cancelBt = document.getElementById("pw-cancel");

      var pendingCode = null, unlocked = false, captureType = "png";

      function setStatus(msg, isErr) {
        statusEl.textContent = msg || "";
        statusEl.className = isErr ? "err" : "";
      }

      function openPaywall(type) {
        captureType = type || "png";
        unlocked = localStorage.getItem("celestial_paid") === "1";
        overlay.style.display = "flex";
        render();
        setStatus(unlocked ? "Önceden ödeme yaptınız, doğrudan indirebilirsiniz."
                           : "İndirmek için önce ödemeyi tamamlayın.");
      }

      function closePaywall() {
        overlay.style.display = "none";
        pendingCode = null;
      }

      function render() {
        payBtn.style.display     = unlocked ? "none" : "";
        document.getElementById("pw-pay-row").style.display = unlocked ? "none" : "";
        codeRow.style.display    = (!unlocked && pendingCode) ? "" : "none";
        dlBtn.style.display      = (unlocked || pendingCode && codeIn.value.toUpperCase() === pendingCode) ? "" : "none";
        dlBtn.value = dlBtn.textContent = captureType === "svg" ? "SVG Olarak İndir" : "PNG Olarak İndir";
      }

      // Demo ödeme: sanal POS yerine onay kutusu ile simüle edilir
      payBtn.addEventListener("click", function () {
        payBtn.disabled = true;
        setStatus("Ödeme alınıyor… lütfen bekleyin");
        setTimeout(function () {
          payBtn.disabled = false;
          pendingCode = "SKY-" + Math.random().toString(36).slice(2, 8).toUpperCase();
          setStatus("Ödemeniz alındı. İndirme kodunuz: " + pendingCode + " — aşağıya girin.");
          codeIn.value = pendingCode; // demo kolaylığı: kod otomatik doldurulur
          render();
          dlBtn.style.display = "";
        }, 700);
      });

      codeIn.addEventListener("input", render);

      dlBtn.addEventListener("click", function () {
        if (pendingCode && !unlocked) {
          if (codeIn.value.trim().toUpperCase() !== pendingCode) {
            setStatus("Kod hatalı.", true);
            return;
          }
          localStorage.setItem("celestial_paid", "1");
          unlocked = true;
          pendingCode = null;
        }
        doDownload(captureType);
        closePaywall();
      });

      cancelBt.addEventListener("click", closePaywall);
      overlay.addEventListener("click", function (e) { if (e.target === overlay) closePaywall(); });

      function pad(n) { return n < 10 ? "0" + n : "" + n; }

      function fileName(ext) {
        var d;
        try {
          var dt = Celestial.date();
          if (dt) { d = dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate()); }
        } catch (e) { /* fallback aşağıda */ }
        if (!d) { d = new Date().toISOString().slice(0, 10); }
        return "gokyuzu-haritasi-" + d + ext;
      }

      function triggerDownload(href, name) {
        var a = document.createElement("a");
        a.href = href; a.download = name; a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      function doDownload(type) {
        if (type === "svg") {
          var svgNode = document.querySelector("#celestial-map svg");
          if (!svgNode) { setStatus("SVG çıktısı bulunamadı, PNG indiriliyor.", true); type = "png"; }
          else {
            var xml = new XMLSerializer().serializeToString(svgNode),
                blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + xml], { type: "image/svg+xml;charset=utf-8" }),
                url = URL.createObjectURL(blob);
            triggerDownload(url, fileName(".svg"));
            setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
            return;
          }
        }
        // PNG: canvas'taki güncel görünüm (seçili tarih/açılar dahil)
        var canvas = document.querySelector("#celestial-map canvas");
        if (canvas) {
          triggerDownload(canvas.toDataURL("image/png"), fileName(".png"));
        }
      }

      // Formdaki PNG/SVG indirme butonlarını paywall'a bağla
      function hook(id, type) {
        var el = document.getElementById(id);
        if (!el) return;
        // mevcut click dinleyicilerini devre dışı bırak: klonlama
        var clone = el.cloneNode(true);
        el.parentNode.replaceChild(clone, el);
        clone.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopImmediatePropagation();
          openPaywall(type);
          return false;
        });
      }

      // celestial.js formu asenkron hazırladığından biraz gecikmeyle bağlan
      window.addEventListener("load", function () {
        setTimeout(function () {
          hook("download-png", "png");
          hook("download-svg", "svg");
        }, 300);
      });
    })();
  </script>
</body>
</html>
